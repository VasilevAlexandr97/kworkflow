x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  image: kworkflow-app:latest   # одно имя — образ собирается один раз и переиспользуется
  env_file:
    - .env

services:
  migrations:
    <<: *app-build
    restart: "no"
    command: uv run alembic upgrade head

  web:
    <<: *app-build
    stop_grace_period: 30s
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - 8000:8000
    restart: unless-stopped
    command: uv run uvicorn --factory kworkflow.main.web:create_app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
  
  telegram_bot:
    <<: *app-build
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uv run telegram-bot

  worker:
    <<: *app-build
    stop_grace_period: 30s
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uv run taskiq worker kworkflow.main.worker:broker kworkflow.background_tasks.tasks --workers 1

  scheduler:
    <<: *app-build
    stop_grace_period: 30s
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uv run taskiq scheduler kworkflow.main.worker:scheduler kworkflow.background_tasks.tasks
